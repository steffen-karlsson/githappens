[package]
name = "githappens"
version = "0.1.0"
edition = "2024"
description = "Personal GitHub dashboard in your terminal"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
anyhow = "1"
thiserror = "2"
webbrowser = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
async-trait = "0.1"
directories = "5"

[dev-dependencies]
rstest = "0.23"
wiremock = "0.6"
pretty_assertions = "1"
assert_cmd = "2"
insta = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
strip = true
lto = true
codegen-units = 1

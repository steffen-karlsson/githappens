query OpenPRs($first: Int!, $after: String) {
  viewer {
    login
    pullRequests(states: OPEN, first: $first, after: $after, orderBy: {field: UPDATED_AT, direction: DESC}) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        number
        title
        url
        body
        isDraft
        mergeable
        headRefOid
        additions
        deletions
        createdAt
        repository {
          nameWithOwner
        }
        commits(last: 1) {
          nodes {
            commit {
              statusCheckRollup {
                state
                contexts(first: 100) {
                  nodes {
                    __typename
                    ... on CheckRun {
                      name
                      status
                      conclusion
                      startedAt
                      completedAt
                      output {
                        summary
                        text
                      }
                    }
                    ... on StatusContext {
                      context
                      state
                      description
                      required
                      createdAt
                    }
                  }
                }
              }
            }
          }
        }
        reviews(first: 100) {
          nodes {
            author {
              login
            }
            state
            submittedAt
            body
          }
        }
        comments(first: 100) {
          nodes {
            author {
              login
            }
            body
            createdAt
          }
        }
      }
    }
  }
}

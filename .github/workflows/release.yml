name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Calculate next semantic version from conventional commits since last tag.
  # First release is v0.1.0. No tag yet → start at 0.1.0.
  # feat: → minor bump, fix:/perf: → patch bump, BREAKING CHANGE or !: → major bump.
  calculate-version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: version
        run: |
          python3 - <<'PY'
          import subprocess, sys, re, os

          gh_output = os.environ.get("GITHUB_OUTPUT", "/dev/null")

          def set_output(name, value):
              with open(gh_output, "a") as f:
                  f.write(f"{name}={value}\n")

          # Get latest tag (if any)
          result = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0"],
              capture_output=True, text=True
          )
          has_tag = result.returncode == 0
          latest_tag = result.stdout.strip() if has_tag else None

          # Determine commit range
          if has_tag:
              rev_range = f"{latest_tag}..HEAD"
              # Get commits since last tag
              log = subprocess.run(
                  ["git", "log", rev_range, "--pretty=format:%s"],
                  capture_output=True, text=True
              ).stdout
              commits = log.strip().splitlines() if log.strip() else []
          else:
              # No tags yet — first release
              set_output("version", "0.1.0")
              set_output("tag", "v0.1.0")
              set_output("should_release", "true")
              sys.exit(0)

          if not commits:
              set_output("should_release", "false")
              sys.exit(0)

          # Parse current version from tag (strip leading 'v')
          current = latest_tag.lstrip("v")
          parts = current.split(".")
          major, minor, patch = int(parts[0]), int(parts[1]), int(parts[2])

          # Analyze commits for version bump
          bump_major = False
          bump_minor = False
          bump_patch = False

          for subject in commits:
              # Check for breaking change marker: "scope!" or "BREAKING CHANGE"
              if "!" in subject.split(":")[0] or "BREAKING CHANGE" in subject:
                  bump_major = True
              # Conventional commit types
              m = re.match(r"^(\w+)(\(.+\))?!?:", subject)
              if m:
                  ctype = m.group(1)
                  if "!" in subject.split(":")[0]:
                      bump_major = True
                  elif ctype == "feat":
                      bump_minor = True
                  elif ctype in ("fix", "perf", "refactor", "build", "chore", "docs", "style", "test"):
                      bump_patch = True
              else:
                  # Non-conventional commit → patch bump
                  bump_patch = True

          if bump_major:
              major += 1
              minor = 0
              patch = 0
          elif bump_minor:
              minor += 1
              patch = 0
          elif bump_patch:
              patch += 1
          else:
              set_output("should_release", "false")
              sys.exit(0)

          version = f"{major}.{minor}.{patch}"
          tag = f"v{version}"
          set_output("version", version)
          set_output("tag", tag)
          set_output("should_release", "true")
          PY

  build:
    name: Build (${{ matrix.target }})
    needs: calculate-version
    if: needs.calculate-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/githappens dist/
          tar czf githappens-${{ needs.calculate-version.outputs.version }}-${{ matrix.target }}.tar.gz -C dist githappens

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        run: |
          mkdir -p dist
          copy target\${{ matrix.target }}\release\githappens.exe dist\
          cd dist && 7z a ..\githappens-${{ needs.calculate-version.outputs.version }}-${{ matrix.target }}.zip githappens.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: githappens-${{ matrix.target }}
          path: githappens-${{ needs.calculate-version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Tag and release
    needs: [calculate-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        id: notes
        run: |
          python3 - <<'PY'
          import subprocess, re

          result = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0"],
              capture_output=True, text=True
          )
          if result.returncode == 0:
              rev_range = f"{result.stdout.strip()}..HEAD"
          else:
              rev_range = "HEAD"

          log = subprocess.run(
              ["git", "log", rev_range, "--pretty=format:%s"],
              capture_output=True, text=True
          ).stdout

          lines = ["## Changes\n"]
          for subject in log.strip().splitlines():
              m = re.match(r"^(\w+)(\(.+\))?:\s*(.+)", subject)
              if m:
                  ctype = m.group(1)
                  desc = m.group(3)
                  if ctype == "feat":
                      lines.append(f"- ✨ {desc}")
                  elif ctype == "fix":
                      lines.append(f"- 🐛 {desc}")
                  elif ctype == "perf":
                      lines.append(f"- ⚡ {desc}")
                  elif ctype == "docs":
                      lines.append(f"- 📝 {desc}")
                  elif ctype == "chore":
                      lines.append(f"- 🔧 {desc}")
                  elif ctype == "refactor":
                      lines.append(f"- ♻️ {desc}")
                  else:
                      lines.append(f"- {subject}")
              else:
                  lines.append(f"- {subject}")

          # Write to file to preserve newlines
          with open("release_notes.md", "w") as f:
              f.write("\n".join(lines))
          PY

      - name: Create tag
        run: |
          git tag ${{ needs.calculate-version.outputs.tag }}
          git push origin ${{ needs.calculate-version.outputs.tag }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.calculate-version.outputs.tag }}
          name: ${{ needs.calculate-version.outputs.tag }}
          body_path: release_notes.md
          files: artifacts/*/*
          fail_on_unmatched_files: true

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --json > coverage.json
      - name: Extract coverage summary
        id: summary
        run: |
          python3 - <<'PY'
          import json, os
          from collections import defaultdict

          with open("coverage.json") as f:
              data = json.load(f)

          # Per-file coverage grouped by package (directory under src/)
          files = data["data"][0]["files"]
          packages = defaultdict(lambda: {"count": 0, "covered": 0})

          for file_entry in files:
              path = file_entry["filename"]
              summary = file_entry["summary"]
              # Extract package name from path (e.g. src/github/client.rs -> github)
              parts = path.replace("\\", "/").split("/src/")
              if len(parts) > 1:
                  pkg = parts[1].split("/")[0]
              else:
                  pkg = "other"
              packages[pkg]["count"] += summary["lines"]["count"]
              packages[pkg]["covered"] += summary["lines"]["covered"]

          # Overall totals
          total = data["data"][0]["totals"]
          overall_pct = round(total["lines"]["percent"], 2)

          # Build markdown table
          lines = ["| Package | Covered | Total | Coverage |", "|---------|---------|-------|----------|"]
          for pkg in sorted(packages):
              p = packages[pkg]
              pct = round(p["covered"] / p["count"] * 100, 2) if p["count"] else 0
              lines.append(f"| `{pkg}` | {p['covered']} | {p['count']} | {pct}% |")
          lines.append(f"| **Total** | **{total['lines']['covered']}** | **{total['lines']['count']}** | **{overall_pct}%** |")

          table = "\n".join(lines)

          gh_output = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          with open(gh_output, "a") as f:
              f.write(f"lines_pct={overall_pct}\n")
              f.write(f"table<<EOF\n{table}\nEOF\n")
          print(f"Line coverage: {overall_pct}%")
          PY
      - name: Find coverage comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Coverage Report
      - name: Post or update coverage comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Coverage Report

            ${{ steps.summary.outputs.table }}

            _Generated by `cargo llvm-cov`_

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit 2>&1 | tee audit-output.txt || true
      - name: Read audit output
        id: audit
        run: |
          echo "output<<EOF" >> $GITHUB_OUTPUT
          cat audit-output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Find audit comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Security Audit Report
      - name: Post or update audit comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Security Audit Report

            ```
            ${{ steps.audit.outputs.output }}
            ```

            _Generated by `cargo audit`_

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
